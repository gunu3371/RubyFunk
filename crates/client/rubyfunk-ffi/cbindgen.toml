"AUDIO_CODEC_AC3" = "RUBYFUNK_AUDIO_CODEC_AC3"
"AUDIO_CODEC_EAC3" = "RUBYFUNK_AUDIO_CODEC_EAC3"
"AUDIO_BITSTREAM_MAGIC" = "RUBYFUNK_AUDIO_BITSTREAM_MAGIC"
"AUDIO_BITSTREAM_HEADER" = "RUBYFUNK_AUDIO_BITSTREAM_HEADER"
"AUDIO_BITSTREAM_AC3" = "RUBYFUNK_AUDIO_BITSTREAM_AC3"
"AUDIO_BITSTREAM_EAC3" = "RUBYFUNK_AUDIO_BITSTREAM_EAC3"
# These two land on the SAME names as their ABI mirrors, which is the existing pattern
# (`HOST_CAP_PEN`, `CLIENT_CAP_CURSOR`): cbindgen emits both, and an identical `#define` twice is
# a benign redefinition in C. One name for one bit is the point — an embedder that reaches for
# either spelling gets the same constant.
"CLIENT_CAP_AUDIO_HIRES" = "RUBYFUNK_CLIENT_CAP_AUDIO_HIRES"
"CLIENT_CAP_KEEP_HOST_AUDIO" = "RUBYFUNK_CLIENT_CAP_KEEP_HOST_AUDIO"
"HOST_CAP_AUDIO_HIRES" = "RUBYFUNK_HOST_CAP_AUDIO_HIRES"
"HOST_CAP2_TOUCH" = "RUBYFUNK_HOST_CAP2_TOUCH"

# R21: every remaining exported constant, prefixed. cbindgen emits a bare `#define` per
# `pub const`, so without an entry here names as generic as MAX_PADS, TAG_LEN, ABI_VERSION and
# INPUT_MAGIC land in the namespace of every C embedder that includes this header — and, as the
# note above says, a clashing #define silently takes the last definition rather than failing to
# compile. The table above had been doing this by hand for the handful someone noticed; this is
# the rest of them, so the stated rule finally holds for the whole surface.
#
# NOT covered, deliberately: associated constants (`ColorInfo_CP_BT709`, `ClockResync_ROUNDS`,
# `ResyncGuard_MAX_REJECTED_STREAK`). cbindgen already qualifies those with their type name,
# which is the very property whose absence makes a bare `MAX_PADS` dangerous — they are
# namespaced, just not by us.
