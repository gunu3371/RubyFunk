language = "C"
pragma_once = true
include_guard = "RUBYFUNK_CORE_H"
autogen_warning = "/* Generated by cbindgen from rubyfunk-ffi. Do not edit by hand. */"
header = "/* rubyfunk C ABI — see crates/client/rubyfunk-ffi/src/lib.rs */"
style = "type"
cpp_compat = true
tab_width = 4
documentation = true
documentation_style = "c99"

# The surface is this crate plus core's constants and `#[repr(C)]` vocabulary.
[parse]
parse_deps = true
include = ["rubyfunk-core"]
extra_bindings = ["rubyfunk-core"]

[export]
# Internal platform-only FFI — NOT part of the C ABI. cbindgen otherwise sweeps the foreign
# imports and their #[repr(C)] structs into the header, where socklen_t/ssize_t/iovec/msghdr are
# undefined and the C harness fails to compile: the Apple batched recv (transport/udp.rs
# `recvmsg_x` + `MsghdrX`) and the Android bionic mmsg bindings (`android_mmsg` module).
#
# `SOFT_LIMIT_KNEE` is host-side CAPTURE processing (the operator gain's soft knee, applied before
# the encoder). No C embedder can act on it — they receive already-gained audio — so exporting it
# would add a bare `#define` to the ABI surface, against R21 below, for a constant with no meaning
# on that side of the boundary. Excluded rather than renamed: the header stays byte-identical.
exclude = [
    "MsghdrX",
    "recvmsg_x",
    "mmsghdr",
    "sendmmsg",
    "recvmmsg",
    "SOFT_LIMIT_KNEE",
    # Normalized-scroll machinery that stays Rust-internal: the quantizer, the
    # outbound seam, the unit marker and the decoded view. C embedders pack an
    # InputEvent by hand from ScrollSource/ScrollPhase + RUBYFUNK_SCROLL_SCALE.
    "ScrollAccumulator",
    "ScrollOutput",
    "ScrollUnits",
    "ScrollEvent",
    # Wayland axis units come from the Linux presenter only; no C embedder sends them.
    "SCROLL_FLAG_AXIS_UNITS",
    "SCROLL_AXIS_UNITS_PER_DETENT",
    # The ABI mirror `RUBYFUNK_HOST_CAP2_SCROLL` already emits the
    # constant; exporting the core one too would duplicate the `#define`.
    "HOST_CAP2_SCROLL",
]
# Reached by no exported SIGNATURE, so cbindgen's sweep misses it — but a C embedder needs the
# vocabulary: `rubyfunk_connection_end_reason` writes one of these as a bare byte (deliberately,
# so the JNI/Swift sides can marshal a `u8` rather than an enum), which without this would leave
# the header documenting names it never defines.
# `ScrollSource`/`ScrollPhase` are reached by no exported signature either — an embedder
# packs a normalized scroll event by hand (kind SCROLL, flags = source | phase << 8) and
# needs the named vocabulary, same case as RubyFunkEndReason above.
include = ["RubyFunkEndReason", "ScrollSource", "ScrollPhase"]

[export.rename]
"InputEvent" = "RubyFunkInputEvent"
"InputKind" = "RubyFunkInputKind"
"ScrollSource" = "RubyFunkScrollSource"
"ScrollPhase" = "RubyFunkScrollPhase"
# Gamepad wire constants: bare BTN_* names collide with <linux/input-event-codes.h> (at
# DIFFERENT values — last definition silently wins); prefix everything we export.
"BTN_DPAD_UP" = "RUBYFUNK_BTN_DPAD_UP"
"BTN_DPAD_DOWN" = "RUBYFUNK_BTN_DPAD_DOWN"
"BTN_DPAD_LEFT" = "RUBYFUNK_BTN_DPAD_LEFT"
